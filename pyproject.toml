[project]
name = "studyforge"
version = "0.1.0"
description = "Multi-agent RAG study assistant for studying at two universities"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.131",
    "llama-index-core>=0.14.25,<0.15",
    "llama-index-vector-stores-postgres>=0.9",
    "llama-index-embeddings-huggingface>=0.8",
    "llama-index-postprocessor-sbert-rerank>=0.6",
    "tree-sitter-language-pack",
    "torch>=2.6",
    "langgraph>=1.2.12",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.4",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
    "langfuse>=4.15.6",
]

[project.scripts]
ingest = "studyforge.ingest:main"
ask = "studyforge.retrieval:main"
chat = "studyforge.app:main"

[dependency-groups]
dev = [
    "langchain-community<0.4.2",
    "pytest>=8",
    "python-docx",
    "python-pptx",
    "ragas>=0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studyforge"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: retrieval-quality evals with real models (slow)",
    "llm_eval: answer-quality evals calling the Claude API (needs ANTHROPIC_API_KEY)",
]
addopts = "-m 'not eval and not llm_eval'"
