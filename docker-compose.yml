services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: studyforge
      POSTGRES_PASSWORD: studyforge
      POSTGRES_DB: studyforge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyforge"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
