<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library · studyforge</title>
<link rel="icon" href="/favicon">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
  :root {
    --bg: #FAFAF8; --card: #FFFFFF; --ink: #1F1F1F; --muted: #87867F; --line: #EDECE8;
    --green: #3F6B55; --mint: #EAF1EC; --green-ink: #2F5241; --red: #B4483F;
  }
  html.dark { --bg: #171615; --card: #1C1B1A; --ink: #EDEBE6; --muted: #9A988F; --line: #2B2A28;
            --green: #8DB8A0; --mint: #1C2A22; --green-ink: #B5D3C2; --red: #E07A70; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.6 Inter, system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; letter-spacing: -0.006em; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header a:hover { color: var(--ink); }
  .brand { font-size: 20px; letter-spacing: -0.02em; color: var(--ink); }
  .brand b { color: var(--green); font-weight: 400; }
  main { max-width: 760px; margin: 24px auto 80px; padding: 0 16px; }
  h1 { font-weight: 500; font-size: 28px; letter-spacing: -0.03em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, select { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line);
                  border-radius: 10px; padding: 8px 12px; outline: none; }
  input:focus, select:focus { border-color: var(--green); }
  button { font: inherit; font-size: 14px; border-radius: 999px; padding: 7px 16px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button:hover { border-color: var(--green); }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button.primary:hover { opacity: .92; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 10px; }
  button.ghost:hover { color: var(--red); }
  button.danger { background: var(--red); border-color: var(--red); color: #fff; }
  .status { background: var(--mint); color: var(--green-ink); border-radius: 10px; padding: 10px 14px; font-size: 13px;
            margin: 20px 0 0; display: none; }
  .uni { margin-top: 36px; }
  .uni-name { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--green); margin-bottom: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .subject { padding: 16px 18px; border-top: 1px solid var(--line); }
  .subject:first-child { border-top: 0; }
  .subject-head { display: flex; align-items: center; gap: 12px; }
  .subject-name { font-weight: 500; font-size: 16px; }
  button.fold { background: none; border: 0; padding: 0; border-radius: 4px; font: inherit; color: inherit;
                cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button.fold::before { content: "▸"; display: inline-block; font-size: 12px; width: 10px; color: var(--muted); transition: transform .15s; }
  button.fold[aria-expanded="true"]::before { transform: rotate(90deg); }
  button.fold:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .uni-name .meta { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: 13px; }
  .counts { color: var(--muted); font-size: 13px; flex: 1; }
  .drop { margin-top: 12px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center;
          color: var(--muted); font-size: 14px; transition: all .15s; }
  .drop.over { border-color: var(--green); background: var(--mint); color: var(--green-ink); }
  .drop label { color: var(--green); cursor: pointer; font-weight: 500; }
  .drop input[type=file] { display: none; }
  .files { list-style: none; margin: 10px 0 0; padding: 0; }
  .files li { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 4px 0; }
  .files .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; color: var(--green-ink); background: var(--mint); border-radius: 999px; padding: 1px 9px; }
  .state { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .state::before { content: "●"; margin-right: 5px; font-size: 9px; vertical-align: 1px; }
  .state.indexed { color: var(--green); }
  .state.indexing { color: var(--green); animation: pulse 1.2s ease-in-out infinite; }
  .state.failed { color: var(--red); cursor: help; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .state.indexing { animation: none; } }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<script>
  // follow the chat's light/dark choice (Chainlit keeps it in localStorage on this origin); default light
  try { if (localStorage.getItem("vite-ui-theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
</script>
<header>
  <span class="brand">studyforge<b>.</b></span>
  <nav><a href="/calendar">Calendar</a>&nbsp;&nbsp;&nbsp;<a href="/">← Back to chat</a></nav>
</header>
<main>
  <div class="row" style="gap:14px;align-items:center"><img src="/public/mascot.svg" width="64" height="64" alt=""><h1>Library</h1></div>
  <p class="sub">Your notes by university and subject. Uploads are indexed automatically.</p>

  <div class="row">
    <select id="uni" style="width:160px" aria-label="University"></select>
    <input id="course" placeholder="Subject, e.g. INF100" style="flex:1;min-width:180px">
    <button class="primary" id="add">Add subject</button>
  </div>
  <div class="status" id="status"></div>

  <div id="tree"></div>
</main>

<script>
const TYPES = { notes: "Notes", exams: "Exams", code: "Code", admin: "Admin" };
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// courses start collapsed, universities open; what you toggle is remembered in this browser
const remembered = (k) => { try { return new Set(JSON.parse(localStorage.getItem(k) || "[]")); } catch (e) { return new Set(); } };
const remember = (k, set) => { try { localStorage.setItem(k, JSON.stringify([...set])); } catch (e) {} };
const openCourses = remembered("sf-open-courses"), closedUnis = remembered("sf-closed-unis");

function status(text) { const el = $("#status"); el.textContent = text; el.style.display = text ? "block" : "none"; }

async function api(method, url, body) {
  const opts = { method };
  if (body instanceof FormData) opts.body = body;
  else if (body) { opts.body = JSON.stringify(body); opts.headers = { "Content-Type": "application/json" }; }
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

function indexSummary(files) {
  const done = files.filter((f) => f.status === "indexed").length, failed = files.filter((f) => f.status === "failed").length;
  if (!files.length) return "";
  return (done === files.length ? " · all indexed" : ` · ${done}/${files.length} indexed`) + (failed ? ` · ${failed} failed` : "");
}

function counts(c) {
  const parts = Object.keys(TYPES).filter((t) => c[t]).map((t) => `${TYPES[t]} ${c[t]}`);
  return parts.length ? parts.join(" · ") : "No files yet";
}

function render(tree) {
  const root = $("#tree"), pick = $("#uni"), current = pick.value;
  pick.innerHTML = tree.map((u) => `<option>${esc(u.uni)}</option>`).join("");
  if (current) pick.value = current;
  if (!tree.length) { root.innerHTML = `<div class="empty">No universities yet.<br><img src="/public/mascot.svg" width="72" alt="" style="margin-top:12px"></div>`; return; }
  root.innerHTML = tree.map((u) => `
    <section class="uni">
      <div class="uni-name"><button class="fold" data-fold-uni="${esc(u.uni)}" aria-expanded="${!closedUnis.has(u.uni)}">${esc(u.uni)}
        <span class="meta">${u.subjects.length} subject${u.subjects.length === 1 ? "" : "s"}</span></button></div>
      <div class="card ${closedUnis.has(u.uni) ? "hidden" : ""}">
        ${u.subjects.map((s) => {
          const key = `${u.uni}/${s.name}`, open = openCourses.has(key);
          return `
          <div class="subject" data-uni="${esc(u.uni)}" data-course="${esc(s.name)}">
            <div class="subject-head">
              <button class="fold subject-name" data-fold-course aria-expanded="${open}">${esc(s.name)}</button>
              <span class="counts">${counts(s.counts)}${indexSummary(s.files)}</span>
              <span data-del-subject-slot><button class="ghost" data-arm-subject title="Delete subject">Delete</button></span>
            </div>
            <div class="body ${open ? "" : "hidden"}">
            <div class="drop" data-drop>
              <div class="row" style="justify-content:center">
                <select data-type>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
                <span>Drop files or a .zip here, or <label>browse<input type="file" multiple data-file
                  accept=".zip,.pdf,.pptx,.docx,.md,.txt,.py,.java,.js,.ts,.c,.h,.cpp,.cs,.go,.rs,.r,.sql"></label></span>
              </div>
            </div>
            <ul class="files">
              ${s.files.map((f) => `<li><span class="name">${esc(f.name)}</span>${state(f)}<span class="tag">${TYPES[f.type] || esc(f.type)}</span>
                <span data-del-file-slot><button class="ghost" data-arm-file="${esc(f.path)}">Delete</button></span></li>`).join("")}
            </ul>
            </div>
          </div>`;
        }).join("") || `<div class="subject counts">No subjects</div>`}
      </div>
      ${u.files.length ? `<div class="counts" style="margin-top:6px">+ ${u.files.length} university-wide file(s)</div>` : ""}
    </section>`).join("");
}

async function load() { render((await api("GET", "/api/library")).tree); }

const STATES = { indexed: "Indexed", indexing: "Indexing…", waiting: "Waiting", failed: "Failed" };
const state = (f) => f.status ? `<span class="state ${f.status}"${f.error ? ` title="${esc(f.error)}"` : ""}>${STATES[f.status]}</span>` : "";
const mins = (sec) => sec < 60 ? `${Math.round(sec)} s` : `${Math.round(sec / 60)} min`;
function timing(s) {
  if (!s.elapsed) return "";
  return ` (${mins(s.elapsed)} so far)`;
}

// indexing runs in the background on the server, one file at a time; show progress until it's done
let polling = false;
async function watchIndexing(prefix) {
  if (polling) return;
  polling = true;
  let shown = -1;
  try {
    for (;;) {
      const s = await api("GET", "/api/library/indexing");
      if (s.running && s.done !== shown) { shown = s.done; load(); }  // move the "Indexing…" marker along
      if (!s.running) {
        status(`${prefix}${s.error ? "Indexing failed: " + s.error : "Indexed — " + s.report}`);
        load();
        return;
      }
      status(`${prefix}Indexing ${s.done}/${s.total || "?"}${s.current ? ": " + s.current : ""}${timing(s)}… you can keep working.`);
      await new Promise((r) => setTimeout(r, 2000));
    }
  } catch (e) { status(`${prefix}Lost contact with the server while indexing (${e.message}). Your files are saved.`); }
  finally { polling = false; }
}

async function upload(subjectEl, fileList) {
  if (!fileList.length) return;
  const fd = new FormData();
  fd.append("uni", subjectEl.dataset.uni);
  fd.append("course", subjectEl.dataset.course);
  fd.append("doc_type", $("[data-type]", subjectEl).value);
  for (const f of fileList) fd.append("files", f);
  status(`Uploading ${fileList.length} file(s)…`);
  try {
    const r = await api("POST", "/api/library/upload", fd);
    render(r.tree);
    const note = `Saved ${r.saved} file(s).${r.rejected.length ? " Skipped: " + r.rejected.join("; ") + "." : ""} `;
    if (r.saved) watchIndexing(note); else status(note);
  } catch (e) { status(`Upload failed: ${e.message}`); }
}

$("#add").onclick = async () => {
  const uni = $("#uni").value.trim(), course = $("#course").value.trim();
  if (!uni || !course) return status("Pick a university and type a subject.");
  try { const r = await api("POST", "/api/library/subjects", { uni, course });
        openCourses.add(`${uni}/${course}`); closedUnis.delete(uni);  // a new subject opens, ready for files
        render(r.tree); $("#course").value = "";
        status(`Added ${uni}/${course}. Upload notes to create its expert.`); }
  catch (e) { status(`Not added: ${e.message}`); }
};
$("#course").addEventListener("keydown", (e) => e.key === "Enter" && $("#add").click());

const tree = $("#tree");
tree.addEventListener("click", async (e) => {
  const subject = e.target.closest(".subject");
  const fold = e.target.closest("[data-fold-course], [data-fold-uni]");
  if (fold) {
    const open = fold.getAttribute("aria-expanded") !== "true";
    fold.setAttribute("aria-expanded", String(open));
    if (fold.dataset.foldUni !== undefined) {
      open ? closedUnis.delete(fold.dataset.foldUni) : closedUnis.add(fold.dataset.foldUni);
      remember("sf-closed-unis", closedUnis);
      fold.closest(".uni").querySelector(".card").classList.toggle("hidden", !open);
    } else {
      const key = `${subject.dataset.uni}/${subject.dataset.course}`;
      open ? openCourses.add(key) : openCourses.delete(key);
      remember("sf-open-courses", openCourses);
      $(".body", subject).classList.toggle("hidden", !open);
    }
  } else if (e.target.matches("[data-arm-subject]")) {           // two-step delete, no browser dialogs
    e.target.parentElement.innerHTML = `<button class="danger" data-del-subject>Delete ${esc(subject.dataset.course)}</button>
      <button class="ghost" data-cancel>Cancel</button>`;
  } else if (e.target.matches("[data-arm-file]")) {
    e.target.parentElement.innerHTML = `<button class="danger" data-del-file="${esc(e.target.dataset.armFile)}">Delete</button>
      <button class="ghost" data-cancel>Cancel</button>`;
  } else if (e.target.matches("[data-cancel]")) {
    load();
  } else if (e.target.matches("[data-del-subject]")) {
    try { const r = await api("DELETE", `/api/library/subject?uni=${encodeURIComponent(subject.dataset.uni)}&course=${encodeURIComponent(subject.dataset.course)}`);
          render(r.tree); watchIndexing(`Deleted ${subject.dataset.uni}/${subject.dataset.course}. `); }
    catch (err) { status(`Not deleted: ${err.message}`); }
  } else if (e.target.matches("[data-del-file]")) {
    try { const r = await api("DELETE", `/api/library/file?path=${encodeURIComponent(e.target.dataset.delFile)}`);
          render(r.tree); watchIndexing("Deleted file. "); }
    catch (err) { status(`Not deleted: ${err.message}`); }
  }
});
tree.addEventListener("change", (e) => { if (e.target.matches("[data-file]")) upload(e.target.closest(".subject"), e.target.files); });
for (const ev of ["dragover", "dragleave", "drop"]) {
  tree.addEventListener(ev, (e) => {
    const drop = e.target.closest("[data-drop]");
    if (!drop) return;
    e.preventDefault();
    drop.classList.toggle("over", ev === "dragover");
    if (ev === "drop") upload(drop.closest(".subject"), e.dataTransfer.files);
  });
}
load().then(async () => { if ((await api("GET", "/api/library/indexing")).running) watchIndexing(""); }).catch((e) => status(`Could not load library: ${e.message}`));
</script>
</body>
</html>
