<svg xmlns="http://www.w3.org/2000/svg" width="84" height="96" viewBox="0 0 70 80">
  <style>
    .clip { animation: sway 3.4s ease-in-out infinite; transform-origin: 34px 66px; }
    @keyframes sway { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(-2deg); } }
    .pupil { animation: look 5s ease-in-out infinite; }
    @keyframes look { 0%, 35%, 100% { transform: translate(0, 0); } 45%, 60% { transform: translate(2.4px, 0.4px); }
                      70%, 85% { transform: translate(-2.4px, 0.4px); } }
    .eye { animation: blink 4.8s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }
    .brow { animation: brow 4.8s ease-in-out infinite; }
    @keyframes brow { 0%, 20%, 40%, 100% { transform: translateY(0); } 28% { transform: translateY(-3px); } }
    .smile { animation: grin 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center top; }
    @keyframes grin { 0%, 20%, 40%, 100% { transform: scale(1); } 28% { transform: scale(1.15, 1.3); } }
  </style>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A9299"/><stop offset=".45" stop-color="#D5DADE"/><stop offset="1" stop-color="#737B82"/>
    </linearGradient>
  </defs>
  <!-- the sheet of paper it stands on -->
  <g transform="rotate(-4 35 70)">
    <rect x="10" y="62" width="50" height="14" rx="1.5" fill="#FFFFFF" stroke="#E2E1DB"/>
    <path d="M16 67 H48 M16 71 H40" stroke="#E8E7E1" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g class="clip">
    <!-- the wire: an original paperclip drawn as one rounded stroke, steel with a highlight -->
    <path d="M42 24 V58 a8.5 8.5 0 0 1 -17 0 V15 a12.5 12.5 0 0 1 25 0 V56 a4.5 4.5 0 0 1 -9 0 V28"
          fill="none" stroke="#6B737A" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 24 V58 a8.5 8.5 0 0 1 -17 0 V15 a12.5 12.5 0 0 1 25 0 V56 a4.5 4.5 0 0 1 -9 0 V28"
          fill="none" stroke="url(#steel)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26.2 50 V16 a11.3 11.3 0 0 1 8 -10.6" fill="none" stroke="#F4F6F7" stroke-width="0.9"
          stroke-linecap="round" opacity=".9"/>
    <!-- thick arched eyebrows -->
    <g class="brow" stroke="#1A1A1A" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M21 22.5 q5 -4.5 10 -1"/>
      <path d="M36 21.5 q5 -3.5 10 1"/>
    </g>
    <!-- smile -->
    <path class="smile" d="M29 42 q5.5 5 11 0" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
    <!-- big googly eyes, close together over the wire -->
    <g class="eye">
      <circle cx="26.5" cy="31" r="7" fill="#FFFFFF" stroke="#C9CDD1" stroke-width="1"/>
      <circle cx="41.5" cy="31" r="7" fill="#FFFFFF" stroke="#C9CDD1" stroke-width="1"/>
      <g class="pupil" fill="#141414">
        <circle cx="27.5" cy="32" r="3.1"/>
        <circle cx="42.5" cy="32" r="3.1"/>
      </g>
      <circle cx="26" cy="29.4" r="0.9" fill="#FFFFFF"/>
      <circle cx="41" cy="29.4" r="0.9" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
